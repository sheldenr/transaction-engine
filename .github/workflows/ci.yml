name: CI & Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit & Concurrency Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger_user
          POSTGRES_PASSWORD: ledger_secret
          POSTGRES_DB: ledger_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true

      - name: Verify Go Modules
        run: go mod verify

      - name: Go Vet
        run: go vet ./...

      - name: Run Unit & Concurrency Tests (with Race Detector)
        env:
          PORT: 8080
          DATABASE_URL: postgres://ledger_user:ledger_secret@127.0.0.1:5432/ledger_db?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          ENVIRONMENT: test
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Display Test Coverage Summary
        run: go tool cover -func=coverage.out

  terraform-validate:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (Prod Environment)
        run: terraform -chdir=terraform/environments/prod init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform/environments/prod validate

  docker-trivy-scan:
    name: Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ledger-engine:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ledger-engine:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Enforce Zero Critical Vulnerabilities in Production Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ledger-engine:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
